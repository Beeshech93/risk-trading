<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d19"><title>Acceso | Risk Trading</title>
<style>
:root{color-scheme:dark;--bg:#080d19;--panel:#111a2c;--line:rgba(153,176,220,.18);--text:#f4f7ff;--muted:#8f9fbd;--blue:#8a9dff;--green:#48e0b0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 15% 0%,rgba(91,111,255,.23),transparent 42%),radial-gradient(ellipse at 100% 100%,rgba(42,218,177,.10),transparent 35%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
.card{width:min(100%,440px);padding:30px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(21,31,52,.97),rgba(13,21,37,.98));box-shadow:0 24px 80px #0005}
.logo{height:52px;width:52px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(140deg,#a4b4ff,#7485ff 48%,#52e6bc);color:#081321;font-size:25px;font-weight:950}
.eyebrow{margin-top:20px;color:#a5b3d1;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:750}h1{margin:4px 0 8px;font-size:32px;letter-spacing:-.05em}p{color:var(--muted);font-size:13px}
.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#080f20;border-radius:12px;margin:22px 0}
.tabs button{padding:10px;border:0;border-radius:9px;color:var(--muted);background:transparent;font-weight:750;cursor:pointer}.tabs button.active{background:#202d49;color:#fff}
label{display:block;margin:14px 0 7px;color:#c4cee3;font-size:12px;font-weight:700}input{width:100%;padding:13px;border:1px solid #2b3853;border-radius:12px;background:#060c19;color:#fff;font:inherit;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #8a9dff20}
.submit{width:100%;margin-top:20px;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#aab7ff,#7b8bff 55%,#68e5c0);color:#081321;font-weight:850;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}
.link{display:block;text-align:center;margin-top:14px;color:#b9c5ff;font-size:12px;text-decoration:none}.message{padding:12px;border-radius:10px;margin-top:14px;font-size:12px;display:none;white-space:pre-wrap}.message.show{display:block}.message.error{background:#ff718b15;color:#ffc1cc;border:1px solid #ff718b44}.message.ok{background:#48e0b015;color:#8df1d2;border:1px solid #48e0b044}
.small{margin-top:20px;font-size:11px;line-height:1.7}.small a{color:#b9c5ff}
</style>
</head>
<body><main class="card">
<div class="logo">R</div><div class="eyebrow">Lajan Rapid · Trading tools</div><h1 id="title">Bienvenido</h1><p id="subtitle">Inicia sesión para entrar a tu espacio de gestión de riesgo.</p>
<div class="tabs"><button id="loginTab" class="active" type="button">Iniciar sesión</button><button id="signupTab" type="button">Crear cuenta</button></div>
<form id="authForm">
<label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required placeholder="tu@correo.com">
<label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="Mínimo 8 caracteres">
<div id="confirmWrap" hidden><label for="confirm">Confirmar contraseña</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Repite tu contraseña"></div>
<button class="submit" id="submit" type="submit">Iniciar sesión</button>
</form>
<a class="link" href="#" id="forgot">¿Olvidaste tu contraseña?</a><div id="message" class="message" role="status" aria-live="polite"></div>
<div class="small">Tu cuenta protege el acceso; los datos de trading deben guardarse con políticas de seguridad por usuario. Nunca compartas tu contraseña ni claves API.</div>
</main><script type="module" src="/js/auth.js"></script></body></html>
